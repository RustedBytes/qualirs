[package]
name = "qualirs"
version = "0.5.0"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
edition = "2024"
description = "Structural and architectural code smell detector for Rust"
license = "MIT"
repository = "https://github.com/RustedBytes/qualirs"
homepage = "https://github.com/RustedBytes/qualirs"
documentation = "https://github.com/RustedBytes/qualirs/tree/main/docs"

[lib]
name = "qualirs"
path = "src/lib.rs"

[[bin]]
name = "qualirs"
path = "src/main.rs"

[dependencies]
# AST parsing
syn = { version = "3", features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal output
colored = "3"
comfy-table = "8"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# File walking
ignore = "0.4"

# Remote source preparation
flate2 = "1"
tar = "0.4"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"] }

# Parallelism
rayon = "1"

# Error handling
thiserror = "2"
anyhow = "1"
fixed-json = { version = "0.4.0", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
